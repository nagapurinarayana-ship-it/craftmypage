          # template validator
          cat > src/lib/template-validator.ts <<'EOF'
export type Template = {
  id: string
  category: string
  canvas: { width: number; height: number }
  elements: Array<{ type: string; key: string; editable?: boolean; default?: string }>
}

export function validateTemplate(obj: any): { valid: boolean; errors: string[] } {
  const errors: string[] = []
  if (!obj || typeof obj !== 'object') {
    return { valid: false, errors: ['Template must be an object'] }
  }
  if (!obj.id || typeof obj.id !== 'string') errors.push('id (string) is required')
  if (!obj.category || typeof obj.category !== 'string') errors.push('category (string) is required')
  if (!obj.canvas || typeof obj.canvas.width !== 'number' || typeof obj.canvas.height !== 'number') errors.push('canvas.width and canvas.height (numbers) are required')
  if (!Array.isArray(obj.elements)) errors.push('elements (array) is required')
  else {
    obj.elements.forEach((el: any, i: number) => {
      if (!el.type || typeof el.type !== 'string') errors.push(`elements[${i}].type (string) is required`)
      if (!el.key || typeof el.key !== 'string') errors.push(`elements[${i}].key (string) is required`)
    })
  }
  return { valid: errors.length === 0, errors }
}
EOF

          # verify script
          cat > scripts/verify-templates.js <<'EOF'
#!/usr/bin/env node
const fs = require('fs')
const path = require('path')
const validator = require('../src/lib/template-validator')

const templatesDir = path.join(__dirname, '..', 'src', 'templates')
const files = fs.readdirSync(templatesDir).filter(f => f.endsWith('.json'))
let ok = true
for (const f of files) {
  const content = JSON.parse(fs.readFileSync(path.join(templatesDir, f), 'utf8'))
  const res = validator.validateTemplate(content)
  if (!res.valid) {
    ok = false
    console.error(`Template ${f} is invalid:`)
    res.errors.forEach(e => console.error('  -', e))
  } else {
    console.log(`Template ${f} OK`)
  }
}
process.exit(ok ? 0 : 1)
EOF
          chmod +x scripts/verify-templates.js

          # CI workflow (basic)
          cat > .github/workflows/ci.yml <<'EOF'
name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify templates
        run: npm run verify
EOF

          # Commit and push
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Scaffold: Vite + React + TypeScript + Tailwind (auto)"
          git push origin "$BRANCH"

          # Create PR via GitHub API
          REPO="${GITHUB_REPOSITORY}"
          PR_TITLE="Scaffold: Vite + React + TypeScript + Tailwind"
          PR_BODY="Initial scaffold for CraftMyPage (generated by workflow)."
          PR_DATA=$(printf '{"title":"%s","head":"%s","base":"main","body":"%s"}' "$PR_TITLE" "$BRANCH" "$PR_BODY")
          echo "Creating PR..."
          RESPONSE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -d "$PR_DATA" "https://api.github.com/repos/${REPO}/pulls")
          PR_URL=$(echo "$RESPONSE" | python -c "import sys, json as j; print(j.load(sys.stdin).get('html_url',''))")
          if [ -n "$PR_URL" ]; then
            echo "Pull request created: $PR_URL"
          else
            echo "Failed to create PR. Response:"
            echo "$RESPONSE"
            exit 1
          fi
