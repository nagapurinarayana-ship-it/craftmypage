name: Create scaffold branch
on:
  workflow_dispatch: {}

jobs:
  create-scaffold:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create scaffold branch, files, push, and open PR
        run: |
          set -euo pipefail

          BRANCH="scaffold/vite-react-$(date +%s)"
          echo "Creating branch: $BRANCH"
          git checkout -b "$BRANCH"

          # Ensure directories
          mkdir -p src src/templates src/lib scripts .github/workflows

          # README
          cat > README.md <<'EOF'
# CraftMyPage

Free invitations, resumes and printable designs—created privately in your browser.

This repository is a starter scaffold for the CraftMyPage project.

Quick start

1. Install dependencies
   npm install

2. Run development server
   npm run dev

3. Build for production
   npm run build
   npm run preview

What’s included

- Vite + React + TypeScript starter
- Tailwind CSS setup
- Minimal pages for Invitation Maker and Resume Builder
- Example JSON template and a small template validator
- CI workflow that runs install, build and verification script
EOF

