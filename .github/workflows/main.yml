import React from 'react'

function Nav() {
  return (
    <nav className="p-4 border-b">
      <a href="/" className="mr-4 font-bold">CraftMyPage</a>
      <a href="/invitation-maker" className="mr-2">Invitation Maker</a>
      <a href="/resume-builder">Resume Builder</a>
    </nav>
  )
}

export default function App() {
  const path = typeof window !== 'undefined' ? window.location.pathname : '/'

  let Page: React.ReactNode
  if (path.startsWith('/invitation-maker')) {
    Page = <div className="p-6"><h1 className="text-2xl font-semibold">Invitation Maker (placeholder)</h1><p className="mt-2">Editor coming soon.</p></div>
  } else if (path.startsWith('/resume-builder')) {
    Page = <div className="p-6"><h1 className="text-2xl font-semibold">Resume Builder (placeholder)</h1><p className="mt-2">Editor coming soon.</p></div>
  } else {
    Page = (
      <div className="p-6">
        <h1 className="text-3xl font-bold">Create free invitations, resumes and printable designs</h1>
        <p className="mt-2">Customize original templates and download high-quality PDFs or images. No account, no watermark and no file uploads.</p>
        <div className="mt-6">
          <a href="/invitation-maker" className="inline-block bg-blue-600 text-white px-4 py-2 rounded mr-3">Create an Invitation</a>
          <a href="/resume-builder" className="inline-block border px-4 py-2 rounded">Build a Resume</a>
        </div>
      </div>
    )
  }

  return (
    <div className="min-h-screen font-sans text-gray-900">
      <Nav />
      {Page}
    </div>
  )
}
EOF

