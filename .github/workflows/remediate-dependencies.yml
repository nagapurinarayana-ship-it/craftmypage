name: Remediate compatible dependency advisories

on:
  push:
    branches:
      - chore/production-ci-security-and-docs

permissions:
  contents: write

concurrency:
  group: craftmypage-dependency-remediation
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-ci-security-and-docs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking security updates
        run: npm audit fix --no-fund
      - name: Commit updated dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No compatible lockfile updates were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: apply compatible dependency security fixes'
          git push origin HEAD:chore/production-ci-security-and-docs
